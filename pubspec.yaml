name: nano_lab
description: "Testing the capabilities of Gemini Nano - Google's on-device local AI model."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/nano_lab_launcher_icon.png"
  min_sdk_android: 26
